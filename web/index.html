<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AirDroid Web · Parent Dashboard</title>
<style>
:root{
  --bg:#f4f6f8;--side:#1c2333;--side2:#151b28;--card:#fff;--line:#e5e8ee;
  --text:#1b2433;--muted:#6b778c;--blue:#2f80ed;--teal:#1abc9c;--red:#e74c3c;--ok:#27ae60;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue);text-decoration:none}
button,input,select{font:inherit}
.login-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1c2333,#2f80ed)}
.login-card{width:min(420px,92vw);background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{margin:0 0 6px;font-size:22px}
.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
.login-card button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;margin-top:4px}
.login-card button.ghost{background:#eef3fb;color:#1b2433;margin-top:8px}
.app{display:flex;height:100%}
.side{width:250px;background:var(--side);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:16px 16px 10px;font-weight:800;letter-spacing:.3px}
.brand small{display:block;font-weight:500;opacity:.65;font-size:11px;margin-top:2px}
.device-box{padding:0 12px 12px}
.device-box select{width:100%;padding:8px;border-radius:8px;border:0;background:#2a3348;color:#fff}
.nav{padding:8px;overflow:auto;flex:1}
.nav button{width:100%;text-align:left;background:transparent;border:0;color:#c9d3e5;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.nav button.active,.nav button:hover{background:#2f80ed;color:#fff}
.side-foot{padding:12px;font-size:11px;opacity:.7}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}
.top h2{margin:0;font-size:16px;flex:1}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#eaf6ef;color:var(--ok);font-weight:700}
.pill.off{background:#fdecea;color:var(--red)}
.top button{border:0;background:#eef3fb;padding:8px 12px;border-radius:8px;cursor:pointer}
.view{flex:1;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat{font-size:28px;font-weight:800}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ph{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;min-height:220px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(16,24,40,.06)}
.ph img{width:100%;height:240px;object-fit:cover;background:#dfe6ef}
.ph .cap{padding:10px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .play{position:relative}
.ph .play:after{content:"▶";position:absolute;inset:auto 0 90px 0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:56px;text-align:center}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#f7f9fc;color:#5b677a}
.primary{background:var(--blue)!important;color:#fff!important;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.danger{background:var(--red)!important;color:#fff!important;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.ghost{background:#eef3fb;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
#map{height:420px;border-radius:12px;overflow:hidden;background:#dfe6ef}
#liveImg{max-width:100%;max-height:62vh;border-radius:12px;background:#111;display:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.lightbox.on{display:flex}
.lightbox img{max-width:96vw;max-height:88vh;border-radius:8px}
.hidden{display:none!important}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto}
  .nav{display:flex;overflow:auto;white-space:nowrap}
  .nav button{width:auto}
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="login" class="login-wrap">
  <div class="login-card">
    <h1>AirDroid Web</h1>
    <p>Online parent dashboard — photos, files, location, calls, live view.</p>
    <input id="email" placeholder="Email" autocomplete="username"/>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password"/>
    <button onclick="doLogin()">Sign in</button>
    <button class="ghost" onclick="doRegister()">Create account</button>
    <p id="loginErr" class="muted" style="margin-top:10px"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand">AirDroid Web<small>Parent Control console</small></div>
    <div class="device-box">
      <div class="muted" style="color:#9aa6b8;margin-bottom:6px">Device</div>
      <select id="deviceSel" onchange="onDevice()"></select>
    </div>
    <nav class="nav">
      <button data-tab="home" class="active" onclick="tab('home')">Overview</button>
      <button data-tab="photos" onclick="tab('photos')">Photos</button>
      <button data-tab="videos" onclick="tab('videos')">Videos</button>
      <button data-tab="files" onclick="tab('files')">Files</button>
      <button data-tab="music" onclick="tab('music')">Music</button>
      <button data-tab="captures" onclick="tab('captures')">Snapshots</button>
      <button data-tab="location" onclick="tab('location')">Location</button>
      <button data-tab="calls" onclick="tab('calls')">Call logs</button>
      <button data-tab="sms" onclick="tab('sms')">Messages</button>
      <button data-tab="contacts" onclick="tab('contacts')">Contacts</button>
      <button data-tab="live" onclick="tab('live')">Live view</button>
      <button data-tab="usage" onclick="tab('usage')">App usage</button>
    </nav>
    <div class="side-foot" id="who">Signed in</div>
  </aside>
  <section class="main">
    <div class="top">
      <h2 id="pageTitle">Overview</h2>
      <span id="onlinePill" class="pill off">offline</span>
      <button class="ghost" onclick="refreshTab()">Refresh</button>
      <button class="ghost" onclick="logout()">Logout</button>
    </div>
    <div class="view" id="view"></div>
  </section>
</div>
<div id="box" class="lightbox" onclick="this.classList.remove('on')"><img id="boxImg"/></div>

<script>
const API = location.origin + '/';
const qs = new URLSearchParams(location.search);
let token = qs.get('sessionToken') || qs.get('token') || localStorage.getItem('pc_token') || '';
let devices = [];
let currentTab = qs.get('tab') || 'home';
let map, marker, line, liveTimer;

function $(id){return document.getElementById(id)}
function deviceId(){return $('deviceSel').value}
function device(){return devices.find(x=>x.deviceId===deviceId()) || devices[0] || null}

async function api(path, opt){
  opt = opt || {};
  const url = API + String(path).replace(/^\//,'');
  const r = await fetch(url, {
    method: opt.method || 'GET',
    headers: {'Content-Type':'application/json','x-session-token': token},
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const j = await r.json().catch(function(){return {};});
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showApp(on){
  $('login').classList.toggle('hidden', on);
  $('app').classList.toggle('hidden', !on);
}
async function doLogin(){
  try{
    $('loginErr').textContent = 'Signing in...';
    const j = await api('auth/login',{method:'POST',body:{email:$('email').value.trim(), password:$('password').value}});
    token = j.sessionToken || j.token;
    localStorage.setItem('pc_token', token);
    await boot();
  }catch(e){$('loginErr').textContent = 'Login failed: '+e.message}
}
async function doRegister(){
  try{
    const j = await api('auth/register',{method:'POST',body:{email:$('email').value.trim(), password:$('password').value}});
    token = j.sessionToken || j.token;
    localStorage.setItem('pc_token', token);
    await boot();
  }catch(e){$('loginErr').textContent = 'Register failed: '+e.message}
}
function logout(){
  token=''; localStorage.removeItem('pc_token'); showApp(false);
}
async function boot(){
  if(!token){showApp(false);return}
  try{
    const me = await api('auth/me?sessionToken='+encodeURIComponent(token));
    $('who').textContent = (me.email||'Parent') + ' · ' + (me.familyCode||'');
    const d = await api('devices?sessionToken='+encodeURIComponent(token));
    devices = d.devices || d.children || [];
    const want = qs.get('deviceId') || '';
    $('deviceSel').innerHTML = devices.map(function(x){
      return '<option value="'+x.deviceId+'"'+(x.deviceId===want?' selected':'')+'>'
        +(x.name||x.phoneName||x.deviceId)+'</option>';
    }).join('') || '<option value="">No devices</option>';
    showApp(true);
    onDevice();
    tab(currentTab);
  }catch(e){
    token=''; localStorage.removeItem('pc_token'); showApp(false);
    $('loginErr').textContent = 'Session expired. Sign in again.';
  }
}
function onDevice(){
  const d = device();
  const on = !!(d && (d.online===1 || d.online===true));
  $('onlinePill').textContent = on ? 'ONLINE' : 'offline';
  $('onlinePill').className = 'pill'+(on?'':' off');
  refreshTab();
}
function tab(name){
  currentTab = name || 'home';
  document.querySelectorAll('.nav button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab')===currentTab);
  });
  const titles = {home:'Overview',photos:'Photos',videos:'Videos',captures:'Snapshots',files:'Files',music:'Music',location:'Location',calls:'Call logs',sms:'Messages',contacts:'Contacts',live:'Live view',usage:'App usage'};
  $('pageTitle').textContent = titles[currentTab] || currentTab;
  if(liveTimer){clearInterval(liveTimer); liveTimer=null;}
  refreshTab();
}
function refreshTab(){
  const fn = {
    home: renderHome, photos: renderPhotos, videos: renderVideos, captures: renderCaptures,
    files: renderFiles, music: renderMusic, location: renderLocation, calls: function(){renderComm('calls')},
    sms: function(){renderComm('sms')}, contacts: function(){renderComm('contacts')},
    live: renderLive, usage: renderUsage
  }[currentTab];
  if(fn) fn();
}
function setView(html){$('view').innerHTML = html}

async function cmd(command, payload){
  const d = device(); if(!d) return;
  await api('commands/send',{method:'POST',body:{sessionToken:token,deviceId:d.deviceId,command:command,payload:payload||{}}});
}

async function renderHome(){
  const d = device();
  if(!d){setView('<div class="card">No child paired yet. Open Child app and enter Family Code.</div>');return}
  setView('<div class="grid" id="homeGrid"><div class="card">Loading device...</div></div>');
  let summary = {};
  try{ summary = await api('analytics/summary?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(d.deviceId)); }catch(e){}
  $('homeGrid').innerHTML =
    '<div class="card"><div class="muted">Device</div><div class="stat" style="font-size:20px">'+(d.name||'Child')+'</div><div class="muted">'+(d.phoneName||d.model||d.deviceId)+'</div></div>'+
    '<div class="card"><div class="muted">Battery</div><div class="stat">'+(d.battery==null||d.battery<0?'?':d.battery)+'%</div><div class="muted">'+(d.charging?'charging':'')+'</div></div>'+
    '<div class="card"><div class="muted">Last seen</div><div>'+(d.lastSeen||'-')+'</div></div>'+
    '<div class="card"><div class="muted">Calls</div><div class="stat">'+(summary.calls||0)+'</div></div>'+
    '<div class="card"><div class="muted">SMS</div><div class="stat">'+(summary.sms||0)+'</div></div>'+
    '<div class="card"><div class="muted">Alerts</div><div class="stat">'+(summary.alerts||0)+'</div></div>'+
    '<div class="card"><div class="muted">Open albums</div><div class="row" style="margin-top:8px">'+
      '<button class="primary" onclick="tab(\'photos\')">Photos</button>'+
      '<button class="ghost" onclick="tab(\'videos\')">Videos</button>'+
      '<button class="ghost" onclick="tab(\'live\')">Live</button>'+
    '</div></div>';
}

async function renderPhotos(){
  const d = device(); if(!d){setView('<div class="card">Select a device</div>');return}
  setView('<div class="card"><div class="row"><b>Photo album</b><button class="primary" onclick="refreshGallery(\'photo\')">Refresh from child</button></div><p class="muted">Large AirDroid-style tiles. Tap a photo to open full size.</p><div id="photoGrid" class="photos"><div class="muted">Loading...</div></div></div>');
  try{ await cmd('gallery_photos', {type:'photo'}); }catch(e){}
  await loadGalleryGrid('photo','photoGrid', 8);
}
async function renderVideos(){
  const d = device(); if(!d){setView('<div class="card">Select a device</div>');return}
  setView('<div class="card"><div class="row"><b>Videos</b><button class="primary" onclick="refreshGallery(\'video\')">Refresh from child</button></div><p class="muted">Tap a tile to fetch and play the video from the child phone.</p><div id="videoGrid" class="photos"><div class="muted">Loading...</div></div></div>');
  try{ await cmd('gallery_videos', {type:'video'}); }catch(e){}
  await loadGalleryGrid('video','videoGrid', 8);
}
async function refreshGallery(type){
  try{ await cmd(type==='video'?'gallery_videos':(type==='audio'?'gallery_music':'gallery_photos'), {type:type}); }catch(e){}
  const id = type==='video'?'videoGrid':(type==='audio'?'musicBox':'photoGrid');
  await loadGalleryGrid(type, id, 10);
}
async function loadGalleryGrid(type, boxId, tries){
  const box = $(boxId); if(!box) return;
  const d = device();
  tries = tries || 6;
  let items = [];
  for(let i=0;i<tries;i++){
    try{
      const j = await api('gallery?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(d.deviceId)+'&type='+type+'&_t='+Date.now());
      items = j.items || [];
      if(items.length) break;
    }catch(e){
      box.innerHTML = '<div class="muted">Could not load gallery: '+escapeHtml(e.message)+'</div>';
      return;
    }
    if(i<tries-1) await sleep(1400);
  }
  if(!items.length){
    box.innerHTML = '<div class="muted">No '+type+' yet. Child: allow Photos / Videos / Music, keep monitoring ON, then Refresh.</div>';
    return;
  }
  box.innerHTML = items.slice(0,160).map(function(it,i){
    const nm = it.name || it.displayName || (type+' '+(i+1));
    const id = it.id || it.mediaId || '';
    const thumb = it.thumb ? ('data:image/jpeg;base64,'+it.thumb) : '';
    const cls = type==='video' ? 'ph play' : 'ph';
    const img = thumb
      ? '<img src="'+thumb+'" alt=""/>'
      : '<div style="height:240px;display:flex;align-items:center;justify-content:center;background:#1c2333;color:#fff;font-size:28px">'+(type==='video'?'VIDEO':(type==='audio'?'MUSIC':'PHOTO'))+'</div>';
    const extra = type==='video' && it.durationMs ? Math.round(it.durationMs/1000)+'s · ' : '';
    return '<div class="'+cls+'" onclick="openGalleryItem(\''+String(id)+'\',\''+type+'\',\''+escapeAttr(nm)+'\')">'+img+'<div class="cap">'+escapeHtml(nm)+'<br><span class="muted">'+extra+fmtSize(it.size||0)+'</span></div></div>';
  }).join('');
}
async function openGalleryItem(mediaId, type, name){
  try{
    await cmd('gallery_fetch', {mediaId: mediaId, type: type});
    const note = document.createElement('div');
    note.className='card'; note.id='fetchNote';
    note.innerHTML = 'Opening <b>'+escapeHtml(name)+'</b> from child...';
    $('view').insertAdjacentElement('afterbegin', note);
    for(var i=0;i<22;i++){
      await sleep(1400);
      const r = await api('remote-media/latest?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId())+'&mediaId='+encodeURIComponent(mediaId)+'&_t='+Date.now());
      const item = r.item || r.media;
      const b64 = item && (item.data || item.body || item.base64);
      if(b64 && b64.length>40){
        const n=$('fetchNote'); if(n) n.remove();
        if(type==='video'){
          const url = 'data:'+(item.mime||'video/mp4')+';base64,'+b64;
          setView('<div class="card"><div class="row"><b>'+escapeHtml(name)+'</b><button class="ghost" onclick="tab(\'videos\')">Back</button></div><video controls autoplay style="width:100%;max-height:78vh;background:#000;border-radius:12px" src="'+url+'"></video></div>');
          return;
        }
        if(type==='audio'){
          const url = 'data:'+(item.mime||'audio/mpeg')+';base64,'+b64;
          $('view').insertAdjacentHTML('afterbegin','<div class="card"><b>'+escapeHtml(name)+'</b><audio controls autoplay style="width:100%;margin-top:8px" src="'+url+'"></audio></div>');
          return;
        }
        $('boxImg').src = 'data:image/jpeg;base64,'+b64;
        $('box').classList.add('on');
        return;
      }
    }
    alert('Still waiting on child upload. Keep Child online and try again.');
  }catch(e){alert('Open failed: '+e.message)}
}

async function renderCaptures(){
  const d = device(); if(!d){setView('<div class="card">Select a device</div>');return}
  setView('<div class="card"><b>Saved live / snapshot captures</b><p class="muted">Frames already uploaded to the server.</p><div id="capGrid" class="photos">Loading...</div></div>');
  try{
    const j = await api('media/history?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(d.deviceId));
    const list = j.history || j.media || [];
    const box = $('capGrid');
    if(!list.length){box.innerHTML='<div class="muted">No saved captures yet. Use LIVE Camera / Screen first.</div>';return;}
    box.innerHTML = list.slice(0,80).map(function(m){
      return '<div class="ph" onclick="openCapture(\''+m.id+'\',\''+escapeAttr(m.kind||'')+'\')"><div style="height:140px;display:flex;align-items:center;justify-content:center;background:#1c2333;color:#fff">'+escapeHtml(m.kind||'MEDIA')+'</div><div class="cap">'+escapeHtml((m.createdAt||'').replace('T',' ').replace('Z',''))+'</div></div>';
    }).join('');
  }catch(e){$('capGrid').textContent=e.message}
}
async function openCapture(id, kind){
  try{
    const j = await api('media/item?sessionToken='+encodeURIComponent(token)+'&id='+encodeURIComponent(id));
    const m = j.media; if(!m) throw new Error('empty');
    const b64 = m.body||m.base64;
    if(!b64) throw new Error('no data');
    if(String(kind).toUpperCase().indexOf('AUDIO')>=0){alert('Audio capture '+id);return;}
    $('boxImg').src='data:image/jpeg;base64,'+b64;
    $('box').classList.add('on');
  }catch(e){alert('Open failed: '+e.message)}
}

let filePath = '';
async function renderFiles(){
  const d = device(); if(!d){setView('<div class="card">Select a device</div>');return}
  filePath = '';
  setView('<div class="card"><div class="row"><b>File manager</b><button class="primary" onclick="refreshFiles()">Refresh</button><button class="ghost" onclick="filePath=\'\';refreshFiles()">Root</button></div><p class="muted" id="filePathLabel">Path: /</p><div id="fileBox" class="muted">Loading...</div></div>');
  try{ await cmd('files_browse', {path:'/'}); }catch(e){}
  await loadFiles(8);
}
async function refreshFiles(){ try{await cmd('files_browse',{path:filePath||'/'});}catch(e){} await loadFiles(8); }
async function loadFiles(tries){
  const d = device();
  tries = tries || 6;
  let items = [], path = filePath || '/';
  for(let i=0;i<tries;i++){
    try{
      const j = await api('files/browse?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(d.deviceId)+'&_t='+Date.now());
      items = j.items || j.files || [];
      path = j.path || path;
      if(items.length) break;
    }catch(e){
      $('fileBox').textContent = e.message; return;
    }
    if(i<tries-1) await sleep(1400);
  }
  const lab = $('filePathLabel'); if(lab) lab.textContent = 'Path: '+(path||'/');
  if(!items.length){$('fileBox').textContent='No files yet. Child: All files access + Storage, then Refresh.';return;}
  let html='<table><tr><th>Name</th><th>Size</th><th></th></tr>';
  items.slice(0,250).forEach(function(it){
    const dir = it.isDir || it.directory || it.type==='folder';
    const nm = it.name||it.path||'';
    html += '<tr><td>'+(dir?'<b>📁 ':'📄 ')+escapeHtml(nm)+(dir?'</b>':'')+'</td><td>'+(dir?'':fmtSize(it.size||0))+'</td><td>';
    if(dir) html += '<button class="ghost" onclick="openFolder(\''+escapeAttr(it.path||'')+'\')">Open</button>';
    else {
      html += '<button class="primary" onclick="dlFile(\''+escapeAttr(it.path||'')+'\',\''+escapeAttr(nm)+'\')">Download</button> ';
      html += '<button class="danger" onclick="delFile(\''+escapeAttr(it.path||'')+'\')">Delete</button>';
    }
    html += '</td></tr>';
  });
  html += '</table>';
  $('fileBox').innerHTML = html;
}
async function openFolder(p){ filePath = p; try{await cmd('files_browse',{path:p});}catch(e){} await loadFiles(8); }
async function dlFile(p, name){
  try{
    await api('files/download-request',{method:'POST',body:{sessionToken:token,deviceId:deviceId(),path:p}});
    await cmd('file_fetch',{path:p});
    for(let i=0;i<16;i++){
      await sleep(1500);
      const j = await api('files/download?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId())+'&_t='+Date.now());
      const f = j.file;
      if(f && f.data && f.data.length>40){
        const a=document.createElement('a');
        a.href='data:application/octet-stream;base64,'+f.data;
        a.download=name||'file';
        a.click();
        return;
      }
    }
    alert('Download timeout. Child online?');
  }catch(e){alert(e.message)}
}
async function delFile(p){
  if(!confirm('Delete on child phone?\n'+p)) return;
  try{ await api('files/delete',{method:'POST',body:{sessionToken:token,deviceId:deviceId(),path:p}}); await sleep(1200); refreshFiles(); }catch(e){alert(e.message)}
}

async function renderMusic(){
  const d = device(); if(!d){setView('<div class="card">Select a device</div>');return}
  setView('<div class="card"><div class="row"><b>Music</b><button class="primary" onclick="refreshGallery(\'audio\')">Refresh from child</button></div><p class="muted">Tap Play to stream the track from the child phone.</p><div id="musicBox" class="muted">Loading...</div></div>');
  try{ await cmd('gallery_music', {}); }catch(e){}
  await loadMusic(8);
}
async function loadMusic(tries){
  const box = $('musicBox'); if(!box) return;
  const d = device();
  let items = [];
  for(let i=0;i<(tries||6);i++){
    try{
      const j = await api('gallery?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(d.deviceId)+'&type=audio&_t='+Date.now());
      items = j.items || [];
      if(items.length) break;
    }catch(e){ box.textContent=e.message; return; }
    if(i<(tries||6)-1) await sleep(1400);
  }
  if(!items.length){ box.textContent='No music yet. Allow Music / Audio on child, then Refresh.'; return; }
  let html='<table><tr><th>Track</th><th>Artist</th><th></th></tr>';
  items.slice(0,200).forEach(function(it){
    const id = it.id || it.mediaId || '';
    html += '<tr><td>'+escapeHtml(it.name||'track')+'<br><span class="muted">'+fmtSize(it.size||0)+(it.durationMs?(' · '+Math.round(it.durationMs/1000)+'s'):'')+'</span></td><td>'+escapeHtml(it.artist||it.album||'')+'</td><td><button class="primary" onclick="openGalleryItem(\''+String(id)+'\',\'audio\',\''+escapeAttr(it.name||'track')+'\')">Play</button></td></tr>';
  });
  html+='</table>';
  box.innerHTML=html;
}

async function renderLocation(){
  setView('<div class="card"><div class="row"><button class="primary" onclick="loadLoc()">Live location</button><button class="ghost" onclick="loadHist()">7-day path</button></div><div id="locText" class="muted" style="margin:8px 0"></div><div id="map"></div></div>');
  setTimeout(function(){ensureMap();loadLoc();},40);
}
function ensureMap(){
  if(map) { setTimeout(function(){map.invalidateSize();},50); return; }
  if(typeof L==='undefined'){$('locText').textContent='Map library did not load.';return;}
  map = L.map('map').setView([20.5,78.9],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
}
async function loadLoc(){
  try{
    const j = await api('location?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId())+'&_t='+Date.now());
    const p = j.latest || j.location || (j.locations&&j.locations[0]);
    if(!p){$('locText').textContent='No location yet';return;}
    const lat=p.latitude??p.lat, lon=p.longitude??p.lon;
    $('locText').textContent = lat+', '+lon+' · '+(p.createdAt||'');
    ensureMap();
    if(marker) map.removeLayer(marker);
    marker = L.marker([lat,lon]).addTo(map);
    map.setView([lat,lon],16);
  }catch(e){$('locText').textContent=e.message}
}
async function loadHist(){
  try{
    const j = await api('location/history?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId())+'&days=7');
    const pts = j.points || j.locations || [];
    $('locText').textContent = '7-day path · '+pts.length+' points';
    ensureMap();
    const latlngs = pts.map(function(p){return [p.latitude??p.lat,p.longitude??p.lon];}).filter(function(x){return x[0]&&x[1];});
    if(line) map.removeLayer(line);
    if(latlngs.length){
      line = L.polyline(latlngs,{color:'#2f80ed',weight:4}).addTo(map);
      map.fitBounds(line.getBounds(),{padding:[24,24]});
    }
  }catch(e){$('locText').textContent=e.message}
}

async function renderComm(kind){
  setView('<div class="card"><div class="row"><b>'+kind.toUpperCase()+'</b><button class="primary" onclick="cmd(\''+kind+'_sync\',{});setTimeout(function(){renderComm(\''+kind+'\')},2000)">Sync from child</button></div><div id="commBox" class="muted">Loading...</div></div>');
  try{
    const j = await api(kind+'?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId()));
    const list = j[kind] || j.items || j.messages || [];
    if(!list.length){$('commBox').textContent='No data yet. Sync from child when the phone is online.';return;}
    let html='<table><tr><th>'+kind+'</th></tr>';
    list.slice(0,150).forEach(function(o){
      if(kind==='calls') html+='<tr><td><b>'+escapeHtml(o.direction||'')+'</b> '+escapeHtml(o.number||'')+' · '+(o.durationSeconds||o.duration||0)+'s<br><span class="muted">'+(o.createdAt||'')+'</span></td></tr>';
      else if(kind==='sms') html+='<tr><td><b>'+escapeHtml(o.direction||'')+'</b> '+escapeHtml(o.address||'')+'<br>'+escapeHtml((o.body||'').slice(0,220))+'<br><span class="muted">'+(o.createdAt||'')+'</span></td></tr>';
      else html+='<tr><td><b>'+escapeHtml(o.name||'')+'</b><br>'+escapeHtml(o.number||'')+'</td></tr>';
    });
    html+='</table>';
    $('commBox').innerHTML=html;
  }catch(e){$('commBox').textContent=e.message}
}

async function renderLive(){
  setView('<div class="card"><div class="row">'+
    '<button class="primary" onclick="startLive(\'LIVE_CAMERA_FRONT\')">Front camera</button>'+
    '<button class="ghost" onclick="startLive(\'LIVE_CAMERA_BACK\')">Back camera</button>'+
    '<button class="ghost" onclick="startLive(\'LIVE_SCREEN\')">Screen</button>'+
    '<button class="danger" onclick="stopLive()">Stop</button></div>'+
    '<p class="muted" id="liveSt">One-way live from child (same backend stream as the Parent app).</p>'+
    '<img id="liveImg"/></div>');
}
async function startLive(kind){
  try{
    await api('privacy/request',{method:'POST',body:{sessionToken:token,deviceId:deviceId(),type:kind,facing:kind.indexOf('BACK')>=0?'BACK':'FRONT'}});
    $('liveSt').textContent='LIVE requested: '+kind+' — waiting for frames...';
    if(liveTimer) clearInterval(liveTimer);
    liveTimer = setInterval(function(){pollLive(kind);},400);
  }catch(e){$('liveSt').textContent='LIVE start failed: '+e.message}
}
async function pollLive(kind){
  try{
    const j = await api('media/latest?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId())+'&kind='+kind+'&_t='+Date.now());
    const m=j.media; const b64=m&&(m.body||m.base64);
    if(b64 && String(kind).indexOf('AUDIO')<0){
      const img=$('liveImg'); if(img){img.src='data:image/jpeg;base64,'+b64; img.style.display='block';}
      $('liveSt').textContent='LIVE ON · '+(m.createdAt||'');
    }
  }catch(e){}
}
function stopLive(){ if(liveTimer){clearInterval(liveTimer);liveTimer=null;} $('liveSt').textContent='Stopped'; }

async function renderUsage(){
  setView('<div class="card" id="useBox">Loading usage...</div>');
  try{
    const j = await api('usage?sessionToken='+encodeURIComponent(token)+'&deviceId='+encodeURIComponent(deviceId()));
    const list=j.usage||[];
    if(!list.length){$('useBox').textContent='No usage data yet.';return;}
    let html='<table><tr><th>App</th><th>Time</th></tr>';
    list.forEach(function(u){
      html+='<tr><td>'+escapeHtml(u.appLabel||u.packageName||'')+'</td><td>'+fmtSec(u.foregroundSeconds||0)+'</td></tr>';
    });
    html+='</table>';
    $('useBox').innerHTML=html;
  }catch(e){$('useBox').textContent=e.message}
}

function escapeHtml(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escapeAttr(s){return escapeHtml(s).replace(/"/g,'');}
function fmtSize(n){n=Number(n)||0; if(n>1048576) return Math.round(n/1048576)+' MB'; if(n>1024) return Math.round(n/1024)+' KB'; return n? (n+' B'):'';}
function fmtSec(s){s=Number(s)||0; return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
if(token) boot();
</script>
